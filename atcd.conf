---
hooks:
- name: group join
  when: [group.join]
  command: "echo 'group_join({{.GroupId}},{{.Member}})' >> /tmp/atc_log"
- name: group leave
  when: [group.leave]
  command: "echo 'group_leave({{.GroupId}},{{.Member}})' >> /tmp/atc_log"
- name: shape
  when: [shape.on]
  command: "echo 'shape_on({{.GroupId}})' >> /tmp/atc_log"
- name: unshape
  when: [shape.off]
  command: "echo 'shape_off({{.GroupId}})' >> /tmp/atc_log"
